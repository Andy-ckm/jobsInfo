name: Job Source Smoke Test

on:
  pull_request:
    branches: [master]
    paths:
      - "validation/job_source_smoke.py"
      - "validation/boss_public_collect.py"
      - ".github/workflows/job-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas python-jobspy playwright
          python -m playwright install --with-deps chromium

      - name: Run live source validation
        env:
          PYTHONUNBUFFERED: "1"
          SMOKE_OUT: artifacts/job-source-smoke
        run: python validation/job_source_smoke.py

      - name: Run BOSS public read-only collection
        env:
          PYTHONUNBUFFERED: "1"
          BOSS_OUT: artifacts/boss-public
        run: python validation/boss_public_collect.py

      - name: Upload general validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-source-smoke-results
          path: artifacts/job-source-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload BOSS collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-public-results
          path: artifacts/boss-public
          if-no-files-found: warn
          retention-days: 14
