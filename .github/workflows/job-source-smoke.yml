name: Job Source Smoke Test

on:
  pull_request:
    branches: [master]
    paths:
      - "validation/job_source_smoke.py"
      - ".github/workflows/job-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas python-jobspy

      - name: Run live source validation
        env:
          PYTHONUNBUFFERED: "1"
          SMOKE_OUT: artifacts/job-source-smoke
        run: python validation/job_source_smoke.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-source-smoke-results
          path: artifacts/job-source-smoke
          if-no-files-found: warn
          retention-days: 14
